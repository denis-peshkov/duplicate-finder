name: Feature request
description: Propose new behavior or UX for Duplicate Finder.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature requests help shape the app. For small doc fixes or typos, a pull request is often faster than an issue.

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      options:
        - label: I searched [existing issues](https://github.com/denis-peshkov/duplicate-finder/issues) and did not find this request already open.
          required: true
        - label: I read the [README](https://github.com/denis-peshkov/duplicate-finder/blob/master/README.md) and this is not already supported.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this solve for users finding/removing duplicates?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: UI change, new option, CLI behavior, packaging, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or different designs.
    validations:
      required: false

  - type: dropdown
    id: breaking
    attributes:
      label: Would this require a breaking change for existing users (settings, CLI, install paths)?
      options:
        - "No"
        - "Maybe — needs discussion"
        - "Yes — needs release notes / BREAKING entry"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links, screenshots, related PRs.
    validations:
      required: false
