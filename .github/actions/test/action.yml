name: Test
description: Run pytest

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      shell: bash
      run: pytest -q
