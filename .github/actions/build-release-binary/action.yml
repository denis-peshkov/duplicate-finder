name: Build Release Binary
description: Build duplicate-finder with PyInstaller for one platform and upload artifact

inputs:
  version:
    description: Release version (Major.Minor.run_number)
    required: true
  target:
    description: Target triple (e.g. x86_64-pc-windows-msvc, x86_64-unknown-linux-gnu, aarch64-apple-darwin)
    required: true
  exe:
    description: Built executable file name (duplicate-finder.exe or duplicate-finder)
    required: true
  publish_artifacts:
    description: Package and upload release-binary-* artifact (push to master/release/hotfix)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Linux GUI build deps
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        # customtkinter / tkinter need Tk libs on the runner for PyInstaller collect
        sudo apt-get update
        sudo apt-get install -y python3-tk libxkbcommon-x11-0 libxcb-cursor0
        python -c "import tkinter"

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        # Install with repo placeholder version first — PR SemVer like
        # 2.0.41-pr1 is not PEP 440 and breaks `pip install -e`.
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Set application version
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.version }}"
        echo "Application version: ${VERSION}"
        perl -pi -e "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
        perl -pi -e "s/^APP_VERSION = \".*\"/APP_VERSION = \"${VERSION}\"/" src/config/app_info.py

    - name: Build with PyInstaller
      shell: bash
      run: pyinstaller duplicate_finder.spec

    - name: Package release binary
      if: inputs.publish_artifacts == 'true'
      shell: bash
      run: |
        set -euo pipefail
        BINARY="dist/${{ inputs.exe }}"
        ARCHIVE="$(./.github/scripts/package-release-binary.sh "${{ inputs.version }}" "${{ inputs.target }}" "${BINARY}" dist)"
        echo "ARCHIVE=${ARCHIVE}" >> "${GITHUB_ENV}"

    - name: Upload release binary
      if: inputs.publish_artifacts == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: release-binary-${{ inputs.target }}
        path: ${{ env.ARCHIVE }}
        if-no-files-found: error
