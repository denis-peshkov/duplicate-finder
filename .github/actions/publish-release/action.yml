name: Publish Release
description: Create GitHub Release with binaries, checksums, and source archive

inputs:
  version:
    description: Release version (Major.Minor.run_number)
    required: true
  version_commit:
    description: Commit SHA for the release (from version job)
    required: true
  prerelease:
    description: Whether the GitHub Release is marked as prerelease
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.version_commit }}

    - name: Package source archive
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        ./.github/scripts/package-release-source.sh "${VERSION}" "${{ github.workspace }}" dist

    - name: Download release binaries
      uses: actions/download-artifact@v4
      with:
        pattern: release-binary-*
        path: dist/binaries
        merge-multiple: true

    - name: Create checksums
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        cd dist/binaries
        sha256sum duplicate-finder-* "../duplicate-finder-${VERSION}-src.tar.gz" > SHA256SUMS
        mv SHA256SUMS ../SHA256SUMS

    - name: Create GitHub Release with all assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ inputs.version }}
        target_commitish: ${{ inputs.version_commit }}
        name: v${{ inputs.version }}
        prerelease: ${{ inputs.prerelease == 'true' }}
        generate_release_notes: true
        files: |
          dist/duplicate-finder-*-src.tar.gz
          dist/binaries/duplicate-finder-*
          dist/SHA256SUMS
